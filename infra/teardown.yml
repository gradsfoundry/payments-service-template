# Lives in the org's `ops` repo (gradsfoundry/ops), NOT in a student repo --
# it needs to see every student repo, which a per-student pipeline can't.
# Copy this to that repo as .github/workflows/teardown.yml once it exists.
# See infra/DESIGN.md. Not tested against a real account yet.
name: Sandbox teardown

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 3am UTC
  workflow_dispatch:
    inputs:
      cohort_end:
        description: "Set true to tear down every gradsfoundry-* resource regardless of activity (end of cohort)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  GITHUB_ORG: ${{ vars.STUDENT_ORG }}   # e.g. gradsfoundry
  INACTIVITY_DAYS: ${{ vars.INACTIVITY_DAYS || '14' }}

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Assume the teardown role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TEARDOWN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find stale or (on cohort end) all student repos, tear their resources down
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COHORT_END: ${{ inputs.cohort_end }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${INACTIVITY_DAYS} days" +%s 2>/dev/null || date -u -v-${INACTIVITY_DAYS}d +%s)

          repos=$(gh api "orgs/${GITHUB_ORG}/repos" --paginate --jq '.[].name')

          for repo in $repos; do
            [ "$repo" = "ops" ] && continue

            pushed_at=$(gh api "repos/${GITHUB_ORG}/${repo}" --jq '.pushed_at')
            pushed_epoch=$(date -u -d "$pushed_at" +%s 2>/dev/null || date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$pushed_at" +%s)

            if [ "$COHORT_END" = "true" ] || [ "$pushed_epoch" -lt "$cutoff" ]; then
              fn="gradsfoundry-${repo}"
              ecr="gradsfoundry/${repo}"
              echo "Tearing down ${repo} (fn=${fn}, ecr=${ecr})..."

              aws lambda delete-function-url-config --function-name "$fn" 2>/dev/null || true
              aws lambda delete-function --function-name "$fn" 2>/dev/null || true
              aws ecr delete-repository --repository-name "$ecr" --force 2>/dev/null || true
              aws logs delete-log-group --log-group-name "/aws/lambda/${fn}" 2>/dev/null || true
            fi
          done
