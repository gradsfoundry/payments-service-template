name: CI/CD (deploy to dev)

# First push to main (or a manual run) is the actual "onboarding" step --
# there is no separate signup flow. See README.md and infra/DESIGN.md.
# This deploys to `dev` only. Going live is a separate, deliberate act --
# see promote-to-prod.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for GitHub OIDC -> AWS role assumption, no long-lived AWS keys
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: gradsfoundry/${{ github.event.repository.name }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: gradsfoundry-${{ github.event.repository.name }}-dev

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gradsfoundry
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/gradsfoundry

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure this grad's ECR repo exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --tags Key=gradsfoundry:cohort,Value="${{ vars.COHORT_TAG }}"

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Deliberately NOT using GitHub's `environment:` feature here -- it
    # isn't available on private repos on the Free plan at all (not just
    # the required-reviewers part), and we don't need it: DEV_BASE_URL and
    # PROD_BASE_URL are already two separately-named repo variables, not
    # one variable scoped two ways through Environments. Auto-deploys on
    # every push -- prod's gate is the protected `prod` branch instead.
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy the new image to the dev ECS service
        # infra/DESIGN.md covers the one-time ECS service/task-definition
        # setup this assumes already exists per grad per environment.
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$ECS_SERVICE" --query taskDefinition)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "${{ needs.build-and-push.outputs.image }}" \
            '.containerDefinitions[0].image = $IMAGE | {family, containerDefinitions, networkMode, requiresCompatibilities, cpu, memory, executionRoleArn, taskRoleArn}')
          echo "$NEW_TASK_DEF" > new-task-def.json
          NEW_REVISION_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query "taskDefinition.taskDefinitionArn" --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_REVISION_ARN" \
            --force-new-deployment

          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke-test the redeploy
        # A deploy isn't "done" until the health check actually passes
        # against the live dev environment.
        run: |
          sleep 10
          curl -sf "${{ vars.DEV_BASE_URL }}/api/health" || (echo "Health check failed — deploy did not verify healthy" && exit 1)
