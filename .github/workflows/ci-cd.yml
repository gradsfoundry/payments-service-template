name: CI/CD

# First push to main (or a manual run) is the actual "onboarding" step —
# there is no separate signup flow. See README.md and infra/DESIGN.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for GitHub OIDC -> AWS role assumption, no long-lived AWS keys
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Namespaced by this repo's own name -- no per-student vars to hand-set.
  ECR_REPOSITORY: gradsfoundry/${{ github.event.repository.name }}
  LAMBDA_FUNCTION_NAME: gradsfoundry-${{ github.event.repository.name }}
  COHORT_TAG: ${{ vars.COHORT_TAG }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure this student's ECR repo exists
        # Idempotent: first push creates it, every push after this is a no-op.
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --tags Key=gradsfoundry:cohort,Value="$COHORT_TAG"

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create the Lambda function on first deploy, else update it
        # See infra/DESIGN.md for why a Function URL, and why the execution
        # role is shared (org-level) while the deploy role above is not.
        run: |
          if aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --image-uri "${{ needs.build-and-push.outputs.image }}"
          else
            aws lambda create-function \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --package-type Image \
              --code ImageUri="${{ needs.build-and-push.outputs.image }}" \
              --role "${{ vars.LAMBDA_EXECUTION_ROLE_ARN }}" \
              --timeout 10 \
              --memory-size 256 \
              --tags gradsfoundry:cohort="$COHORT_TAG"

            aws lambda create-function-url-config \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --auth-type NONE

            aws lambda add-permission \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --statement-id FunctionURLAllowPublicAccess \
              --action lambda:InvokeFunctionUrl \
              --principal "*" \
              --function-url-auth-type NONE
          fi

          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Smoke-test the redeploy
        # This is the gate described in the program design: a deploy isn't
        # "done" until the health check actually passes against the live app.
        run: |
          FUNCTION_URL=$(aws lambda get-function-url-config \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query FunctionUrl --output text)
          sleep 10
          curl -sf "${FUNCTION_URL}health" || (echo "Health check failed — deploy did not verify healthy" && exit 1)
