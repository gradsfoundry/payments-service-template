name: Promote to prod

# Runs when a PR into the protected `prod` branch is merged. That merge
# approval IS the change-ticket step -- a plain branch-protection required
# review, not GitHub Environments' reviewer feature (which needs GitHub
# Enterprise once repos are private -- see infra/DESIGN.md). Deploys the
# EXACT image already built and verified in dev; never rebuilds. The image
# tag comes from the PR's head commit (what was actually tested in dev),
# not the new merge commit `prod` gets.
on:
  pull_request:
    types: [closed]
    branches: [prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: gradsfoundry/${{ github.event.repository.name }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: gradsfoundry-${{ github.event.repository.name }}-prod

jobs:
  promote:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm the tested image actually exists in ECR
        id: image
        env:
          # The commit dev already built and deployed from -- not the new
          # merge commit `prod` just received.
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TESTED_SHA" >/dev/null
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$TESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy that exact image to the prod ECS service
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$ECS_SERVICE" --query taskDefinition)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "${{ steps.image.outputs.uri }}" \
            '.containerDefinitions[0].image = $IMAGE | {family, containerDefinitions, networkMode, requiresCompatibilities, cpu, memory, executionRoleArn, taskRoleArn}')
          echo "$NEW_TASK_DEF" > new-task-def.json
          NEW_REVISION_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query "taskDefinition.taskDefinitionArn" --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_REVISION_ARN" \
            --force-new-deployment

          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke-test prod
        run: |
          sleep 10
          curl -sf "${{ vars.PROD_BASE_URL }}/api/health" || (echo "Health check failed — prod did not come up healthy" && exit 1)
