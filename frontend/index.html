<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Payments — Grads Foundry</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #1c1c1c; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; color: #444; margin-top: 36px; }
    #status { font-size: 13px; color: #666; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5e5e5; font-size: 14px; }
    th { color: #666; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .balance { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>Payments</h1>
  <p id="status">Checking API status...</p>

  <h2>Accounts</h2>
  <table>
    <thead><tr><th>#</th><th>Name</th><th>Balance</th></tr></thead>
    <tbody id="accounts"><tr><td colspan="3">Loading...</td></tr></tbody>
  </table>

  <h2>Recent payments</h2>
  <p style="font-size:13px;color:#888">No payment history view yet -- Sprint 1's ticket adds disputes on top of what's here, not this list. Use the API directly (POST /api/payments) to try a transfer.</p>

  <script>
    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        document.getElementById('status').textContent =
          `API: ${d.status} · database connected: ${d.db_connected}`;
      })
      .catch(() => {
        document.getElementById('status').textContent = 'API unreachable.';
      });

    // Seeded accounts are IDs 1-3 -- no /api/accounts list endpoint (by
    // design, so far): this just checks each one individually.
    Promise.all([1, 2, 3].map(id => fetch(`/api/accounts/${id}`).then(r => r.ok ? r.json() : null)))
      .then(accounts => {
        const tbody = document.getElementById('accounts');
        const rows = accounts.filter(Boolean).map(a => `
          <tr>
            <td>${a.id}</td>
            <td>${a.name}</td>
            <td class="balance">$${(a.balance_cents / 100).toFixed(2)}</td>
          </tr>
        `).join('');
        tbody.innerHTML = rows || '<tr><td colspan="3">No accounts found.</td></tr>';
      })
      .catch(() => {
        document.getElementById('accounts').innerHTML = '<tr><td colspan="3">Could not load accounts.</td></tr>';
      });
  </script>
</body>
</html>
